<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F3">
  <title>Cocoahead Field Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="brand/batchstory-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="brand/batchstory-icon-apple-180.png">
    <link rel="preload" href="fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="app.css">
  <script src="config.js"></script>
</head>
<body class="field">
  <header class="bar">
    <div class="bar-in">
      <button class="brand" id="go-home" type="button" aria-label="Home">
        <img src="icons/cocoahead-64.png" alt="" width="28" height="28" data-brand-logo><img class="wordmark" alt="" data-brand-wordmark hidden><span data-brand="company">Cocoahead</span><span class="by-lockup" data-brand-poweredby hidden></span>
      </button>
      <button class="turn-chip" id="turn-chip" type="button" hidden></button>
      <button class="sync" id="sync-badge" type="button" data-state="idle" aria-live="polite">
        <span class="sync-ic" id="sync-ic" aria-hidden="true"></span><span id="sync-text">Checking…</span>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <div class="tabbar-in">
      <button class="tab" type="button" data-tab="home"><span class="tab-ic" data-icon="house" aria-hidden="true"></span><span>Home</span></button>
      <button class="tab" type="button" data-tab="entries"><span class="tab-ic" data-icon="list" aria-hidden="true"></span><span>My entries</span><span class="tab-count" id="tab-count" hidden></span></button>
      <button class="tab" type="button" data-tab="settings"><span class="tab-ic" data-icon="settings" aria-hidden="true"></span><span>Settings</span></button>
    </div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="icons.js"></script>
  <script src="schema.js"></script>
  <script src="db.js"></script>
  <script src="common.js"></script>
  <script src="model.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="help-content.js"></script>
  <script src="turns.js"></script>
  <script src="photos.js"></script>
  <script src="app.js"></script>
</body>
</html>
